<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="page-head">
    <h1>模型管理 <a class="back" href="/admin">← 管理首页</a></h1>
    <p id="summary" class="note">读取中…</p>
  </header>

  <section id="overview" class="card">
    <h2>概览</h2>
    <div id="overview-grid" class="facts"></div>
    <p id="refresh-status" class="note"></p>
    <div id="operations" hidden></div>
  </section>

  <section id="models" class="card">
    <div class="row between">
      <h2>模型</h2>
      <button id="refresh" class="ghost">刷新</button>
    </div>
    <div class="import-box">
      <label for="archive">导入原始模型包归档</label>
      <div class="row">
        <input id="archive" type="file" accept=".tar.gz,.tgz,application/gzip">
        <button id="import">导入</button>
      </div>
      <p class="note tiny">归档由 Framework 校验身份、文件大小、sha256 与原子落盘。</p>
    </div>
    <div id="package-list"><p class="note">尚未读取。</p></div>
  </section>
</main>
<dialog id="delete-dialog">
  <form method="dialog">
    <h2>确认删除原始 Payload</h2>
    <p class="note">这只删除原始模型文件，不注销 Asset Declaration；之后仍可由 Manager 重新下载。</p>
    <pre id="delete-impact" class="impact"></pre>
    <div class="row between">
      <button type="button" class="ghost" data-delete-cancel>取消</button>
      <button type="button" data-delete-confirm>确认删除</button>
    </div>
  </form>
</dialog>
<script src="/admin/session.js"></script>
<script src="app.js"></script>
</body>
</html>
